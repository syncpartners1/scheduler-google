name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: change-navigator-abn
  PROJECT_NUMBER: '972564781508'
  REGION: me-west1
  REGISTRY: me-west1-docker.pkg.dev/change-navigator-abn/change-navigator-docker
  SERVICE: scheduler-google
  DEPLOY_SA: main-app-sa@change-navigator-abn.iam.gserviceaccount.com
  RUNTIME_SA: scheduler-sa@change-navigator-abn.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Load browser Maps key from Secret Manager
        id: maps-key
        shell: bash
        run: |
          key="$(gcloud secrets versions access latest \
            --secret=SCHEDULER_GOOGLE_MAPS_API_KEY \
            --project="${PROJECT_ID}")"
          echo "::add-mask::${key}"
          printf 'value=%s\n' "${key}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        env:
          MAPS_KEY: ${{ steps.maps-key.outputs.value }}
        run: |
          IMAGE="${REGISTRY}/scheduler-google:${GITHUB_SHA::8}"
          docker build \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${MAPS_KEY}" \
            --tag "${IMAGE}" \
            --tag "${REGISTRY}/scheduler-google:latest" \
            .
          docker push "${IMAGE}"
          docker push "${REGISTRY}/scheduler-google:latest"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="${RUNTIME_SA}" \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --concurrency=80 \
            --timeout=30 \
            --set-secrets="API_KEY=SCHEDULER_GOOGLE_API_KEY:latest,GAS_URL=SCHEDULER_GOOGLE_GAS_URL:latest" \
            --project="${PROJECT_ID}" \
            --quiet

      - name: Verify deployment
        run: |
          URL="$(gcloud run services describe "${SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)')"
          curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            "${URL}/api/health"
          echo "Deployed ${URL}"
